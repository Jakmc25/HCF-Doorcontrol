<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fairgrounds Door Control</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --card: #fff;
        --ink: #1d2330;
        --muted: #697386;
        --line: #e3e6ec;
        --accent: #1f5fbf;
        --ok: #1c7c3d;
        --warn: #b3261e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.45 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        background: #16233a;
        color: #fff;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 18px 14px 60px;
      }
      h2 {
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 28px 0 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }
      .door-name {
        font-weight: 600;
        font-size: 16px;
      }
      .state {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        margin-left: 6px;
      }
      .locked {
        background: #e6f4ea;
        color: var(--ok);
      }
      .unlocked {
        background: #fdecea;
        color: var(--warn);
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin: 4px 0 10px;
      }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 7px;
        padding: 6px 10px;
        cursor: pointer;
        margin: 0 6px 6px 0;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      button.danger {
        color: var(--warn);
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        vertical-align: top;
      }
      th {
        background: #fafbfc;
        color: var(--muted);
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      tr:last-child td {
        border-bottom: none;
      }
      form .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 12px;
        align-items: flex-end;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 3px;
        font-weight: 600;
      }
      input[type="text"],
      input[type="time"],
      input[type="date"],
      select {
        font: inherit;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .checks label {
        display: inline-block;
        font-size: 14px;
        color: var(--ink);
        font-weight: 400;
        margin: 0 12px 4px 0;
      }
      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: #16233a;
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: 90vw;
      }
      .toast.show {
        opacity: 1;
      }
      .toast.err {
        background: var(--warn);
      }
      .pill {
        font-size: 12px;
        padding: 1px 7px;
        border-radius: 99px;
        background: #eef1f6;
        color: var(--muted);
      }
      .now {
        color: var(--warn);
        font-weight: 600;
      }
      .fail {
        color: var(--warn);
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header
      ><h1>Fairgrounds Door Control</h1><span id="clock" class="muted"></span
    ></header>
    <main>
      <h2>Doors</h2>
      <div id="doors" class="grid"><div class="muted">Loading…</div></div>

      <h2>Schedules</h2>
      <div id="schedules"></div>
      <div class="card" style="margin-top: 12px">
        <form id="sched-form">
          <strong id="form-title">Add a schedule</strong>
          <p class="sub"
            >The doors unlock at the start time and go back to normal (or lock)
            at the end time. Choose weekdays for a repeating schedule, or one
            date for a one-time event.</p
          >
          <div class="row">
            <div
              ><label>Name</label
              ><input
                type="text"
                id="f-name"
                placeholder="Office hours"
                required
            /></div>
            <div
              ><label>Starts</label><input type="time" id="f-start" required
            /></div>
            <div
              ><label>Ends</label><input type="time" id="f-end" required
            /></div>
            <div
              ><label>When it ends</label>
              <select id="f-endaction"
                ><option value="reset"
                  >Return to the door's normal schedule</option
                ><option value="keep_lock">Lock and keep locked</option></select
              ></div
            >
          </div>
          <div class="row checks"
            ><div><label>Doors</label><span id="f-doors"></span></div
          ></div>
          <div class="row">
            <div class="checks"
              ><label>Repeats on</label><span id="f-days"></span
            ></div>
            <div
              ><label>…or one date only</label><input type="date" id="f-date"
            /></div>
          </div>
          <button class="primary" type="submit" id="f-save"
            >Save schedule</button
          >
          <button type="button" id="f-cancel" style="display: none"
            >Cancel edit</button
          >
        </form>
      </div>

      <h2>Coming up (next 7 days)</h2>
      <div id="upcoming"></div>

      <h2>Recent activity</h2>
      <div id="log"></div>
    </main>
    <div id="toast" class="toast"></div>
    <script>
      const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      let doors = [],
        editingId = null;
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      function toast(msg, err) {
        const t = $("toast");
        t.textContent = msg;
        t.className = "toast show" + (err ? " err" : "");
        clearTimeout(toast.h);
        toast.h = setTimeout(() => (t.className = "toast"), 3500);
      }
      async function api(method, url, body) {
        const r = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || "Error " + r.status);
        return j;
      }

      function ruleText(d) {
        const map = {
          keep_unlock: "kept unlocked",
          keep_lock: "kept locked",
          custom: "temporarily unlocked",
          lock_early: "locked early",
          lock_now: "locked",
          schedule: "on its normal schedule",
        };
        return d.rule ? map[d.rule] || d.rule : "";
      }
      async function loadDoors() {
        try {
          doors = await api("GET", "/api/doors");
          $("doors").innerHTML =
            doors
              .map((d) => {
                const unlocked = d.relay === "unlock";
                return `<div class="card">
        <div><span class="door-name">${esc(d.name)}</span><span class="state ${unlocked ? "unlocked" : "locked"}">${unlocked ? "Unlocked" : "Locked"}</span></div>
        <div class="sub">${esc(ruleText(d))}</div>
        <button class="primary" data-id="${esc(d.id)}" data-act="unlock_for" data-min="60">Unlock 1 hr</button>
        <button data-id="${esc(d.id)}" data-act="unlock_for" data-ask="1">Unlock for…</button>
        <button data-id="${esc(d.id)}" data-act="keep_unlock">Keep unlocked</button>
        <button class="danger" data-id="${esc(d.id)}" data-act="lock">Lock now</button>
        <button data-id="${esc(d.id)}" data-act="reset">Back to normal</button>
      </div>`;
              })
              .join("") || '<div class="muted">No doors found.</div>';
          renderDoorChoices();
        } catch (e) {
          $("doors").innerHTML =
            `<div class="card fail">Can't reach the door controller: ${esc(e.message)}</div>`;
        }
      }
      $("doors").addEventListener("click", async (ev) => {
        const b = ev.target.closest("button");
        if (!b) return;
        let minutes = b.dataset.min ? Number(b.dataset.min) : undefined;
        if (b.dataset.ask) {
          const v = prompt("Unlock for how many minutes? (max 480)", "120");
          if (!v) return;
          minutes = Number(v);
        }
        if (
          b.dataset.act === "keep_unlock" &&
          !confirm("Keep this door unlocked until you change it?")
        )
          return;
        b.disabled = true;
        try {
          const r = await api("POST", `/api/doors/${b.dataset.id}/action`, {
            action: b.dataset.act,
            minutes,
          });
          toast(r.message);
        } catch (e) {
          toast(e.message, true);
        }
        await refreshAll();
      });

      function renderDoorChoices(selected) {
        const sel = new Set(
          selected ||
            [...document.querySelectorAll("#f-doors input:checked")].map(
              (i) => i.value,
            ),
        );
        $("f-doors").innerHTML =
          `<label><input type="checkbox" value="*" ${sel.has("*") ? "checked" : ""}> All doors</label>` +
          doors
            .map(
              (d) =>
                `<label><input type="checkbox" value="${esc(d.id)}" ${sel.has(d.id) ? "checked" : ""}> ${esc(d.name)}</label>`,
            )
            .join("");
      }
      function renderDayChoices(selected) {
        $("f-days").innerHTML = DAYS.map(
          (n, i) =>
            `<label><input type="checkbox" value="${i}" ${(selected || []).includes(i) ? "checked" : ""}> ${n}</label>`,
        ).join("");
      }
      function doorNames(ids) {
        if (ids.includes("*")) return "All doors";
        return ids
          .map(
            (i) =>
              (doors.find((d) => d.id === i) || { name: "(removed door)" })
                .name,
          )
          .join(", ");
      }
      async function loadSchedules() {
        const list = await api("GET", "/api/schedules");
        window._scheds = list;
        $("schedules").innerHTML = list.length
          ? `<table><tr><th>Name</th><th>When</th><th>Doors</th><th>At end</th><th></th></tr>` +
            list
              .map(
                (s) => `<tr>
      <td>${esc(s.name)} ${s.enabled ? "" : '<span class="pill">paused</span>'}</td>
      <td>${s.date ? esc(s.date) : s.days.map((d) => DAYS[d]).join(", ")}<br>${esc(s.start)} – ${esc(s.end)}</td>
      <td>${esc(doorNames(s.doors))}</td>
      <td>${s.end_action === "keep_lock" ? "Lock" : "Normal schedule"}</td>
      <td><button data-edit="${s.id}">Edit</button><button data-toggle="${s.id}">${s.enabled ? "Pause" : "Resume"}</button><button class="danger" data-del="${s.id}">Delete</button></td>
    </tr>`,
              )
              .join("") +
            "</table>"
          : '<div class="card muted">No schedules yet. Add one below.</div>';
      }
      $("schedules").addEventListener("click", async (ev) => {
        const b = ev.target.closest("button");
        if (!b) return;
        try {
          if (b.dataset.del) {
            if (!confirm("Delete this schedule?")) return;
            await api("DELETE", "/api/schedules/" + b.dataset.del);
          } else if (b.dataset.toggle) {
            const s = window._scheds.find((x) => x.id == b.dataset.toggle);
            await api("PUT", "/api/schedules/" + s.id, {
              ...s,
              enabled: !s.enabled,
            });
          } else if (b.dataset.edit) {
            return startEdit(
              window._scheds.find((x) => x.id == b.dataset.edit),
            );
          }
          await refreshAll();
        } catch (e) {
          toast(e.message, true);
        }
      });
      function startEdit(s) {
        editingId = s.id;
        $("form-title").textContent = "Edit schedule";
        $("f-cancel").style.display = "";
        $("f-name").value = s.name;
        $("f-start").value = s.start;
        $("f-end").value = s.end;
        $("f-endaction").value = s.end_action;
        $("f-date").value = s.date || "";
        renderDoorChoices(s.doors);
        renderDayChoices(s.days);
        $("sched-form").scrollIntoView({ behavior: "smooth" });
      }
      function resetForm() {
        editingId = null;
        $("sched-form").reset();
        $("form-title").textContent = "Add a schedule";
        $("f-cancel").style.display = "none";
        renderDoorChoices([]);
        renderDayChoices([]);
      }
      $("f-cancel").onclick = resetForm;
      $("sched-form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const body = {
          name: $("f-name").value,
          start: $("f-start").value,
          end: $("f-end").value,
          end_action: $("f-endaction").value,
          doors: [...document.querySelectorAll("#f-doors input:checked")].map(
            (i) => i.value,
          ),
          days: [...document.querySelectorAll("#f-days input:checked")].map(
            (i) => Number(i.value),
          ),
          date: $("f-date").value || null,
          enabled: true,
        };
        if (body.doors.includes("*")) body.doors = ["*"];
        if (editingId) {
          const old = window._scheds.find((x) => x.id === editingId);
          body.enabled = old ? old.enabled : true;
        }
        try {
          if (editingId) await api("PUT", "/api/schedules/" + editingId, body);
          else await api("POST", "/api/schedules", body);
          toast("Schedule saved");
          resetForm();
          await refreshAll();
        } catch (e) {
          toast(e.message, true);
        }
      });

      async function loadUpcoming() {
        const rows = await api("GET", "/api/upcoming");
        const fmt = (iso) =>
          new Date(iso).toLocaleString([], {
            weekday: "short",
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit",
          });
        $("upcoming").innerHTML = rows.length
          ? `<table><tr><th>When</th><th>What</th><th>Doors</th><th>From</th></tr>` +
            rows
              .map(
                (w) =>
                  `<tr><td>${w.active ? '<span class="now">NOW · </span>' : ""}${esc(fmt(w.start))} → ${esc(fmt(w.end))}</td><td>${esc(w.title)}</td><td>${esc(w.doors.join(", "))}</td><td><span class="pill">${w.source}</span></td></tr>`,
              )
              .join("") +
            "</table>"
          : '<div class="card muted">Nothing scheduled in the next 7 days.</div>';
      }
      async function loadLog() {
        const rows = await api("GET", "/api/log");
        $("log").innerHTML = rows.length
          ? `<table><tr><th>Time</th><th>Door</th><th>What</th><th>By</th></tr>` +
            rows
              .map(
                (r) =>
                  `<tr><td>${esc(r.time)}</td><td>${esc(r.door)}</td><td class="${r.ok ? "" : "fail"}">${esc(r.ok ? r.detail : "FAILED: " + r.detail)}</td><td class="muted">${esc(r.source)}</td></tr>`,
              )
              .join("") +
            "</table>"
          : '<div class="card muted">No activity yet.</div>';
      }
      async function refreshAll() {
        await loadDoors();
        await Promise.all(
          [loadSchedules(), loadUpcoming(), loadLog()].map((p) =>
            p.catch((e) => toast(e.message, true)),
          ),
        );
      }
      renderDayChoices([]);
      refreshAll();
      setInterval(() => {
        loadDoors();
        loadUpcoming();
        loadLog();
      }, 20000);
      setInterval(
        () =>
          ($("clock").textContent = new Date().toLocaleString([], {
            weekday: "short",
            hour: "numeric",
            minute: "2-digit",
          })),
        1000,
      );
    </script>
  </body>
</html>
