<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Fairgrounds Door Control</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header
      ><h1>Fairgrounds Door Control</h1
      ><div class="who"
        ><span id="clock" class="muted"></span><span id="user"></span
        ><button type="button" id="signout" class="signout" hidden
          >Sign out</button
        ></div
      ></header
    >
    <main>
      <h2>Doors</h2>
      <div id="doors" class="grid"><div class="muted">Loading…</div></div>

      <h2>Schedules</h2>
      <div id="schedules"></div>
      <div class="card spaced">
        <form id="sched-form">
          <strong id="form-title">Add a schedule</strong>
          <p class="sub"
            >The doors unlock at the start time and go back to normal (or lock)
            at the end time. Choose weekdays for a repeating schedule, or one
            date for a one-time event.</p
          >
          <div class="row">
            <div
              ><label>Name</label
              ><input
                type="text"
                id="f-name"
                placeholder="Office hours"
                required
            /></div>
            <div
              ><label>Starts</label><input type="time" id="f-start" required
            /></div>
            <div
              ><label>Ends</label><input type="time" id="f-end" required
            /></div>
            <div
              ><label>When it ends</label>
              <select id="f-endaction"
                ><option value="reset"
                  >Return to the door's normal schedule</option
                ><option value="keep_lock">Lock and keep locked</option></select
              ></div
            >
          </div>
          <div class="row checks"
            ><div><label>Doors</label><span id="f-doors"></span></div
          ></div>
          <div class="row">
            <div class="checks"
              ><label>Repeats on</label><span id="f-days"></span
            ></div>
            <div
              ><label>…or one date only</label><input type="date" id="f-date"
            /></div>
          </div>
          <button class="primary" type="submit" id="f-save"
            >Save schedule</button
          >
          <button type="button" id="f-cancel" hidden>Cancel edit</button>
        </form>
      </div>

      <h2>Coming up (next 7 days)</h2>
      <div id="upcoming"></div>

      <h2>Recent activity</h2>
      <div id="log"></div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
