name: door-control
services:
  app:
    build: .
    image: door-control:1.0.0
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:8480:8480"
    environment:
      # Values come from .env next to this file (never commit it); see .env.example.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      PUBLIC_HOSTS: ${PUBLIC_HOSTS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
    # /data holds config.json (UniFi/Telegram tokens, calendar URL), doorcontrol.db,
    # session-secret and accounts.json. Never run "docker compose down -v".
    volumes:
      - door_control_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
volumes:
  door_control_data:
    name: door_control_data
